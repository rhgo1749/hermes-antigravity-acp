sha: "<40-HEX-AT-SUBMISSION>"
subdir: hermes-plugin/antigravity-acp
version: 0.7.11
description: >-
  Google Antigravity through Google's official ACP server (ACP v1 JSON-RPC
  over stdio). Disclosure — registers one model provider at import and
  nothing else (no tools, hooks, middleware, or commands); Hermes launches
  the user's official Antigravity ACP launcher as a child process, and all
  Google sign-in (oauth-personal / oauth-business / gemini-api-key /
  agent-platform) happens inside Google's own runtime, never through keys
  this plugin reads; the plugin holds no credentials.  Operational overrides
  HERMES_ANTIGRAVITY_ACP_COMMAND/_ARGS (launch target), _NATIVE_VIDEO /
  _NATIVE_TOKEN_LIMIT / _ROTATION_FRACTION (multimodal and context policy),
  _STATE_FILE / _STATE_TTL_SECONDS / _STATE_MAX_ENTRIES /
  _LIMIT_STATE_FILE / _LIMIT_TTL_SECONDS (session and rate-limit state
  under the active profile home), and _RATE_LIMIT_RETRIES are all optional.
  Writes only its own state files under the active Hermes profile home.
  Third-party network traffic is exclusively from the official Google ACP
  child process to Google endpoints; the plugin itself opens no connections.
  Model listing is live-only (every id comes from the signed-in account's
  official server); an attended in-terminal login driver is offered through
  Hermes' standard provider setup_status login_command when the server
  reports it is not signed in. Setup (repository install_official.py, run
  once by the user, never at plugin import) downloads the official
  Antigravity ACP server release from Google's first-party distribution at
  dl.google.com and verifies it against the first-party feed digest
  (SHA-256, checked before extraction) recorded in the repository.  The provider never
  auto-approves native execution: native run_command is disabled at session
  launch and native file-mutation or command permission frames are rejected,
  so shell and file work goes through Hermes' own approval-gated terminal and
  file tools.
  A separately installed opt-in MUX script (never imported by the plugin)
  can run one official ACP server child per signed-in Google account for
  session affinity. The plugin may retain an initialized server child in a
  warm pool for reuse and discards it on incompatible identity or error.
  Some Core helper and session-context dependencies remain private and
  security-sensitive; their compatibility risks and fail-closed behavior are
  documented in docs/hermes-compatibility.md. Lineage: not a derivative of any listed
  antigravity plugin; different transport and architecture (Google's official
  ACP stdio server, not an agy CLI wrapper).
maintainer: rhgo1749
tier: community
category: models
requires_hermes: ">=0.21.6"
docs_url: https://github.com/rhgo1749/hermes-antigravity-acp/blob/main/docs/hermes-compatibility.md
