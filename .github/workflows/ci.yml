name: Credential-free ACP checks

# Issue #9 tier contract (see tests/test_ci_tier_contract.py):
#   Fast PR (every event):      fake-acp, upstream-hermes-compat,
#                               catalog-floor-gate
#   Release / full OS:          acp-clean-room, windows-x64, macos-arm64 —
#                               every main push, every manual dispatch, and
#                               PRs that touch the install surface
#   Extended ARM:               windows-arm64, linux-aarch64 — every main
#                               push, every manual dispatch, and PRs that
#                               touch the packaging surface only
# The always-running `CI gate` job is the single honest verdict: a lane
# that the detected scope required and then failed, skipped, or never
# reported fails the gate. Required status checks should be set to
# `CI gate` (plus optionally the three fast lanes); never to a
# conditional lane name, whose skip must never read as green.
# Issue #28 Phase B: a `workflow_dispatch` that supplies `candidate_sha`
# additionally pins EVERY job's checkout to that exact commit, each lane
# attests its own `git rev-parse HEAD`, and the conditional `Release gate`
# job (scripts/release_gate_check.py + release/verification-matrix.json)
# certifies full five-target verification for THAT SHA ONLY. Ordinary
# pushes/PRs leave `candidate_sha` empty and behave exactly as before.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this full-matrix run was dispatched (recorded in the change-scope summary)"
        required: false
        default: "manual full-OS verification"
      candidate_sha:
        description: "Full 40-hex release-candidate SHA to pin every checkout to (empty = ordinary full-matrix run, no release certification)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  change-scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      os_lanes: ${{ steps.scope.outputs.os_lanes }}
      extended_arm: ${{ steps.scope.outputs.extended_arm }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: Classify changed paths (unknown paths or detection failure fall back to the strongest scope)
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_AFTER_SHA: ${{ github.sha }}
          CI_DISPATCH_REASON: ${{ github.event.inputs.reason }}
        run: python3 scripts/ci_change_scope.py --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  candidate-identity:
    name: Candidate identity
    # Issue #28 Phase B: binds a release-candidate dispatch to one exact
    # commit in repository history. Runs ONLY for a workflow_dispatch that
    # supplied candidate_sha; ordinary events skip this job and the Release
    # gate with it. Fails closed on a non-full SHA, a missing object, or a
    # candidate unreachable from any advertised branch.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' && inputs.candidate_sha != ''
    outputs:
      candidate: ${{ steps.identity.outputs.candidate }}
      candidate_tree: ${{ steps.identity.outputs.candidate_tree }}
      main_head: ${{ steps.identity.outputs.main_head }}
      candidate_on_main: ${{ steps.identity.outputs.candidate_on_main }}
      candidate_is_main_head: ${{ steps.identity.outputs.candidate_is_main_head }}
      candidate_reachable: ${{ steps.identity.outputs.candidate_reachable }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve and bind the exact release-candidate SHA
        id: identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: python3 scripts/candidate_identity.py --candidate-sha "$CANDIDATE_SHA" --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  fake-acp:
    name: Fake ACP regressions and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      attested_sha: ${{ steps.attest.outputs.sha }}
      stages: ${{ steps.attest.outputs.stages }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install test tools
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 pytest-asyncio==1.4.0 ruff==0.15.10
      - name: Run static checks
        run: ruff check scripts hermes-plugin tests
      - name: Audit repository hygiene
        run: python scripts/audit_public_tree.py
      - name: Run credential-free regressions
        # Auto-discovery: every file under tests/ runs unless upstream-venv-only.
        # test_upstream_hermes_runtime_contracts.py needs the upstream Hermes
        # venv and is exercised by the upstream-hermes-compat job below.
        run: >-
          python -m pytest -q tests
          --ignore=tests/test_upstream_hermes_runtime_contracts.py
      - name: Clean-env install smoke (verified vs registry-pinned OS tiers)
        # Credential-free fake-ACP lifecycle for install paths
        # A/B/combined plus the per-platform registry-pin install mechanics
        # behind the README verification tiers (Linux x86_64 carries a bounded
        # out-of-repo initialize-only canary record; macOS arm64 and Linux
        # aarch64 are registry-pinned only; Windows x64/arm64 run real
        # binaries in their own hosted job). The executed
        # real-binary install lifecycle for Linux x86_64 lives in the
        # acp-clean-room job below — this job authenticates nothing and never
        # executes the real Google binary.
        run: python -m pytest -q tests/test_clean_env_e2e_smoke.py
      - name: Attest tested SHA and verified stages
        id: attest
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$CANDIDATE_SHA" ]; then
            echo "checkout HEAD $head != candidate $CANDIDATE_SHA" >&2
            exit 1
          fi
          {
            echo "sha=$head"
            echo "stages=error_timeout_permission_failclosed,session_resume_recovery"
          } >> "$GITHUB_OUTPUT"

  acp-clean-room:
    name: Fresh-UID clean room with official ACP binary (ubuntu-24.04)
    # This GitHub-hosted
    # ubuntu-24.04 VM is the clean room. A dedicated OS UID created with
    # useradd executes the whole credential-free real-binary chain (fetch
    # official ACP 1.4.4 -> exact publisher SHA-256 pin -> standalone install
    # -> status/verify -> real unauthenticated initialize -> Hermes provider
    # selection/model-discovery entry -> uninstall/reinstall -> fail-closed
    # diagnostics) with an empty disposable HOME and HERMES_HOME.
    # No Docker-in-Docker, no privileged containers, no secrets.*, no Google
    # credentials or login, no live inference, no catalog submission (that
    # is separate). Prior private-container attempts stay NOT EXECUTED.
    # Tier (issue #9): release/full-OS lane. Runs on every main push, every
    # manual full-matrix dispatch, and PRs that touch the install surface;
    # the CI gate fails closed if the scope required it and it did not
    # succeed.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: change-scope
    if: needs.change-scope.outputs.os_lanes == 'true'
    permissions:
      contents: read
    outputs:
      attested_sha: ${{ steps.attest.outputs.sha }}
      stages: ${{ steps.attest.outputs.stages }}
    env:
      CLEAN_ROOM_USER: acpcr94
      CLEAN_ROOM_HOME: /home/acpcr94
      CLEAN_ROOM_HERMES_HOME: /home/acpcr94/hermes-home
      CLEAN_ROOM_UPSTREAM: /home/acpcr94/upstream-hermes
      ACP_EXPECTED_SHA256: baf31b7a97602dee359cf2a43f72b6e11c6bf354be874987d80660cd3526bb6a
      HERMES_CORE_REF: a9ff9799e273f525b82718cdc69fdec71b1dca5a
      CLEAN_ROOM_EVIDENCE_FILE: /tmp/clean-room-evidence.jsonl
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: Preflight host and reviewed supply-chain pin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, platform, sys
          sys.path.insert(0, ".")
          from antigravity_acp.registry import VERSION, resolve_distribution
          dist = resolve_distribution("linux", "x86_64")
          assert platform.machine() == "x86_64", "clean room requires an x86_64 runner"
          assert VERSION == "1.4.4", f"registry version drifted: {VERSION}"
          expected = os.environ["ACP_EXPECTED_SHA256"]
          message = "registry pin no longer equals the reviewed digest"
          assert dist.sha256 == expected, message
          print("preflight: reviewed ACP 1.4.4 publisher pin active")
          PY
      - name: Provide pinned uv to the clean-room UID
        run: |
          set -euo pipefail
          # A world-readable venv under /opt: a pip user-site install would
          # land under /home/runner and be non-traversable by other UIDs.
          sudo python3 -m venv /opt/uv94
          sudo /opt/uv94/bin/pip install --disable-pip-version-check --quiet uv==0.13.5
          sudo chmod -R a+rX /opt/uv94
          sudo ln -sf /opt/uv94/bin/uv /usr/local/bin/uv
          /opt/uv94/bin/uv --version
      - name: Checkout official Hermes Core at the reviewed pinned commit
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_CORE_REF }}
          path: upstream-hermes-src
          persist-credentials: false
      - name: Create dedicated clean-room OS UID
        run: |
          set -euo pipefail
          sudo useradd --create-home --shell /bin/bash "$CLEAN_ROOM_USER"
          sudo mkdir -p "$CLEAN_ROOM_HERMES_HOME"
          sudo mv upstream-hermes-src "$CLEAN_ROOM_UPSTREAM"
          # Stage a clean-room copy of the repo code the driver executes.
          # The workspace checkout stays runner-owned and is deliberately
          # not traversable by the clean-room UID (DAC isolation).
          sudo mkdir -p "$CLEAN_ROOM_HOME/repo"
          sudo cp -a "$GITHUB_WORKSPACE/scripts" "$GITHUB_WORKSPACE/antigravity_acp" \
            "$GITHUB_WORKSPACE/hermes-plugin" "$CLEAN_ROOM_HOME/repo/"
          sudo chown -R "$CLEAN_ROOM_USER:" "$CLEAN_ROOM_HOME" "$CLEAN_ROOM_HERMES_HOME" "$CLEAN_ROOM_UPSTREAM"
          # Prove the world-readable pinned uv resolves for the clean-room
          # identity itself before any chain step depends on it.
          sudo -u "$CLEAN_ROOM_USER" env -i \
            HOME="$CLEAN_ROOM_HOME" PATH=/usr/local/bin:/usr/bin:/bin \
            /usr/local/bin/uv --version
          # OS-UID separation proof: a private canary only the runner user
          # can read; the driver fails closed if the clean-room UID can.
          install -d -m 700 "$HOME/.cr94canary"
          printf 'cr94-private-canary\n' > "$HOME/.cr94canary/private"
          chmod 600 "$HOME/.cr94canary/private"
          {
            echo "## Fresh-UID clean room"
            echo "- runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "- $(lsb_release -ds) / $(uname -sr)"
            echo "- runner user uid: $(id -u)"
            echo "- clean-room user: $CLEAN_ROOM_USER uid=$(id -u "$CLEAN_ROOM_USER")"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Execute the real-binary clean-room chain as the dedicated UID
        run: |
          set -euo pipefail
          sudo -u "$CLEAN_ROOM_USER" env -i \
            HOME="$CLEAN_ROOM_HOME" \
            USER="$CLEAN_ROOM_USER" \
            LOGNAME="$CLEAN_ROOM_USER" \
            PATH=/usr/local/bin:/usr/bin:/bin \
            HERMES_HOME="$CLEAN_ROOM_HERMES_HOME" \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            ACP_EXPECTED_SHA256="$ACP_EXPECTED_SHA256" \
            HERMES_CORE_REF="$HERMES_CORE_REF" \
            CLEAN_ROOM_EVIDENCE_FILE="$CLEAN_ROOM_EVIDENCE_FILE" \
            /usr/bin/python3 "$CLEAN_ROOM_HOME/repo/scripts/hosted_clean_room_ci.py"
      - name: Fail closed on secret shapes in the sanitized evidence
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f "$CLEAN_ROOM_EVIDENCE_FILE" ]; then
            echo "clean-room driver produced no evidence file; run is not acceptable" >&2
            exit 1
          fi
          /usr/bin/python3 "$GITHUB_WORKSPACE/scripts/hosted_clean_room_ci.py" \
            --scan-file "$CLEAN_ROOM_EVIDENCE_FILE"
          {
            echo "### Sanitized clean-room evidence (JSONL)"
            echo
            echo '```text'
            cat "$CLEAN_ROOM_EVIDENCE_FILE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Confirm the runner user has no live ACP/Hermes/Google state
        if: always()
        run: |
          set -euo pipefail
          test ! -e "$HOME/.local/opt/antigravity-acp"
          test ! -e "$HOME/.local/bin/antigravity-acp-official"
          test ! -e "$HOME/.hermes"
          test ! -e "$HOME/.gemini"
          echo "runner-user live state: untouched"
      - name: Attest tested SHA and verified stages
        id: attest
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$CANDIDATE_SHA" ]; then
            echo "checkout HEAD $head != candidate $CANDIDATE_SHA" >&2
            exit 1
          fi
          {
            echo "sha=$head"
            echo "stages=binary_publisher_pin_sha256,install_status_verify_uninstall,provider_registration_enabled,provider_selection_factory,acp_initialize_unauthenticated,platform_security_hardening"
          } >> "$GITHUB_OUTPUT"

  windows-x64:
    name: Windows install and unauthenticated ACP (x64)
    # Tier (issue #9): release/full-OS lane (real installer + provider
    # registration + unauthenticated initialize on a hosted x64 runner).
    # Runs on every main push, every manual full-matrix dispatch, and PRs
    # that touch the install surface; the CI gate fails closed if the scope
    # required it and it did not succeed.
    runs-on: windows-2022
    timeout-minutes: 60
    needs: change-scope
    if: needs.change-scope.outputs.os_lanes == 'true'
    permissions:
      contents: read
    outputs:
      attested_sha: ${{ steps.attest.outputs.sha }}
      stages: ${{ steps.attest.outputs.stages }}
    env:
      EXPECTED_MACHINE: AMD64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: Install official Hermes without interactive setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hermesHome = Join-Path $env:RUNNER_TEMP 'acp-hermes'
          "HERMES_HOME=$hermesHome" | Add-Content -Path $env:GITHUB_ENV
          $installer = Join-Path $env:RUNNER_TEMP 'hermes-install.ps1'
          Invoke-WebRequest -Uri 'https://hermes-agent.nousresearch.com/install.ps1' -OutFile $installer
          & $installer -HermesHome $hermesHome -NonInteractive -SkipBrowser -SkipComputerUse
          if ($LASTEXITCODE -ne 0) { throw "Hermes installer failed: $LASTEXITCODE" }
      - name: Run the actual Windows installer
        shell: cmd
        run: call install-windows.cmd < NUL
      - name: Verify architecture, provider registration and ACP initialize
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Get-ChildItem "$env:HERMES_HOME\tools\python-*\python.exe" | Select-Object -Last 1 -ExpandProperty FullName
          if (-not $python) { throw 'Hermes managed Python is missing' }
          & $python -c 'import os, platform; assert platform.machine().upper() == os.environ["EXPECTED_MACHINE"], "unexpected native machine"'
          if ($LASTEXITCODE -ne 0) { throw 'Native architecture check failed' }
          $hermes = Get-ChildItem "$env:HERMES_HOME\bin\hermes.*" -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^hermes\.(exe|cmd)$' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $hermes) { throw 'Hermes launcher is missing' }
          $plugins = & $hermes plugins list --plain
          if ($LASTEXITCODE -ne 0) { throw 'Hermes plugin listing failed' }
          if (($plugins -join "`n") -notmatch '(?m)^enabled\s+user\s+\S+\s+antigravity-acp-provider\s*$') {
            throw 'Installed provider is not enabled'
          }
          & $python scripts/install_acp.py verify
          if ($LASTEXITCODE -ne 0) { throw 'Unauthenticated ACP initialization failed' }
      - name: Verify process-tree teardown reaps the ACP child tree (x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Get-ChildItem "$env:HERMES_HOME\tools\python-*\python.exe" | Select-Object -Last 1 -ExpandProperty FullName
          if (-not $python) { throw 'Hermes managed Python is missing' }
          # Issue #23 P1: TerminateProcess reaches only the direct child; the
          # forced teardown must walk the whole mux -> official-server tree.
          # This is the x64 process-tree verification and is not substituted
          # by the ARM lane.
          & $python scripts/verify_process_tree_teardown.py
          if ($LASTEXITCODE -ne 0) { throw 'Process-tree teardown verification failed' }
      - name: Verify the login helper execution path without authenticating
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Get-ChildItem "$env:HERMES_HOME\tools\python-*\python.exe" | Select-Object -Last 1 -ExpandProperty FullName
          $check = @'
          import json, os, runpy, subprocess, sys
          from pathlib import Path

          login = Path(os.environ['HERMES_HOME']) / 'plugins/model-providers/antigravity-acp/login.py'
          module = runpy.run_path(str(login))
          command, _ = module['_resolve_official_command']()
          child_env = module['_child_env']()
          probe = Path('scripts/acp_probe.py').resolve()

          def run(label, env):
              try:
                  result = subprocess.run(
                      [sys.executable, str(probe), '--timeout', '60', '--', *command],
                      env=env, capture_output=True, text=True, timeout=75,
                  )
              except subprocess.TimeoutExpired:
                  print(f'{label}: FAIL hard-limit exceeded', file=sys.stderr)
                  return None
              if result.returncode:
                  print(f'{label}: FAIL exit={result.returncode}', file=sys.stderr)
                  tail = (result.stderr or '').splitlines()[-30:]
                  for line in tail:
                      print(f'{label}: server-stderr: {line}', file=sys.stderr)
                  return None
              try:
                  summary = json.loads(result.stdout)
              except (ValueError, TypeError):
                  print(f'{label}: FAIL malformed probe output', file=sys.stderr)
                  return None
              if summary.get('protocolVersion') != 1:
                  print(f'{label}: FAIL protocolVersion={summary.get("protocolVersion")!r}', file=sys.stderr)
                  return None
              print(f'{label}: OK')
              return summary

          full_env = dict(os.environ)
          if run('direct-exe-full-env', full_env) is None:
              raise SystemExit('Direct official executable failed even with the full environment')
          if run('direct-exe-login-env', child_env) is None:
              raise SystemExit('Login-path restricted environment failed; see server stderr above')
          print('Verified official login executable under full and restricted environments; no login attempted')
          '@
          $check | & $python -
          if ($LASTEXITCODE -ne 0) { throw 'Login helper initialization failed' }
      - name: Attest tested SHA and verified stages
        id: attest
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (& git rev-parse HEAD).Trim()
          if ($head -ne $env:CANDIDATE_SHA) { throw "checkout HEAD $head != candidate $env:CANDIDATE_SHA" }
          "sha=$head" | Add-Content -Path $env:GITHUB_OUTPUT
          "stages=binary_publisher_pin_sha256,install_status_verify_uninstall,provider_registration_enabled,acp_initialize_unauthenticated,platform_security_hardening" | Add-Content -Path $env:GITHUB_OUTPUT

  windows-arm64:
    name: Windows install and unauthenticated ACP (arm64)
    # Tier (issue #9): extended ARM lane. Removed from the ordinary PR
    # critical path (it dominated every run at ~18 minutes); it now runs on
    # every main push, every manual full-matrix dispatch, and PRs that
    # touch the packaging surface. The CI gate fails closed if the scope
    # required it and it did not succeed.
    runs-on: windows-11-arm
    timeout-minutes: 60
    needs: change-scope
    if: needs.change-scope.outputs.extended_arm == 'true'
    permissions:
      contents: read
    outputs:
      attested_sha: ${{ steps.attest.outputs.sha }}
      stages: ${{ steps.attest.outputs.stages }}
    env:
      EXPECTED_MACHINE: ARM64
    steps:
