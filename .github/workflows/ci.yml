      - name: Verify the login helper execution path without authenticating
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Get-ChildItem "$env:HERMES_HOME\tools\python-*\python.exe" | Select-Object -Last 1 -ExpandProperty FullName
          $check = @'
