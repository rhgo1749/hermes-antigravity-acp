                  return None
              if summary.get('protocolVersion') != 1:
                  print(f'{label}: FAIL protocolVersion={summary.get("protocolVersion")!r}', file=sys.stderr)
                  return None
              print(f'{label}: OK')
              return summary

          full_env = dict(os.environ)
          if run('direct-exe-full-env', full_env) is None:
              raise SystemExit('Direct official executable failed even with the full environment')
          if run('direct-exe-login-env', child_env) is None:
              raise SystemExit('Login-path restricted environment failed; see server stderr above')
          print('Verified official login executable under full and restricted environments; no login attempted')
          '@
          $check | & $python -
          if ($LASTEXITCODE -ne 0) { throw 'Login helper initialization failed' }
      - name: Attest tested SHA and verified stages
        id: attest
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (& git rev-parse HEAD).Trim()
          if ($head -ne $env:CANDIDATE_SHA) { throw "checkout HEAD $head != candidate $env:CANDIDATE_SHA" }
          "sha=$head" | Add-Content -Path $env:GITHUB_OUTPUT
          "stages=binary_publisher_pin_sha256,install_status_verify_uninstall,provider_registration_enabled,acp_initialize_unauthenticated" | Add-Content -Path $env:GITHUB_OUTPUT

  macos-arm64:
    name: macOS arm64 install and unauthenticated ACP
    # Tier (issue #9): release/full-OS lane candidate. Native Apple
    # Silicon execution of the official binary by this repository's
    # CI: download under the registry publisher pin -> install -> status ->
    # integrity verify -> unauthenticated ACP initialize -> uninstall ->
    # confirmed absence. Executed evidence is recorded per run; the README
    # tier is only promoted after a green run is cited there. Since issue
    # #28 Phase B this lane ALSO registers the Hermes provider under a
    # disposable HERMES_HOME and executes the provider selection/factory
    # probe inside an official pinned Hermes Core venv — the same
    # clean_room_provider_probe.py contract as the Linux clean room, minus
    # the dedicated-UID isolation, which remains NOT EXECUTED here. This
    # lane never authenticates.
    runs-on: macos-15
    timeout-minutes: 35
    needs: change-scope
    if: needs.change-scope.outputs.os_lanes == 'true'
    permissions:
      contents: read
    outputs:
      attested_sha: ${{ steps.attest.outputs.sha }}
      stages: ${{ steps.attest.outputs.stages }}
    env:
      HERMES_CORE_REF: a9ff9799e273f525b82718cdc69fdec71b1dca5a
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Assert native Apple Silicon execution
        run: python -c 'import platform, sys; assert sys.platform == "darwin" and platform.machine() == "arm64", (sys.platform, platform.machine())'
      - name: Record registry pin provenance
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from antigravity_acp.registry import VERSION, resolve_distribution
          dist = resolve_distribution("darwin", "arm64")
          print(f"ACP version: {VERSION}")
          print(f"darwin/arm64 publisher digest: {dist.sha256}")
          PY
      - name: Install official ACP binary into isolated prefixes
        run: python scripts/install_official.py --prefix "$RUNNER_TEMP/acp-native" --bin-dir "$RUNNER_TEMP/acp-bin"
      - name: Status and integrity verification
        run: |
          python scripts/install_official.py --prefix "$RUNNER_TEMP/acp-native" --bin-dir "$RUNNER_TEMP/acp-bin" --status
          python scripts/install_official.py --prefix "$RUNNER_TEMP/acp-native" --bin-dir "$RUNNER_TEMP/acp-bin" --verify
      - name: Unauthenticated ACP initialize handshake
        run: python scripts/acp_probe.py --timeout 60 -- "$RUNNER_TEMP/acp-bin/antigravity-acp-official"
      - name: Uninstall and confirm absence
        run: |
          python scripts/install_official.py --prefix "$RUNNER_TEMP/acp-native" --bin-dir "$RUNNER_TEMP/acp-bin" --uninstall
          if python scripts/install_official.py --prefix "$RUNNER_TEMP/acp-native" --bin-dir "$RUNNER_TEMP/acp-bin" --status; then
            echo "installed state survived uninstall" >&2
            exit 1
          fi
      - name: Install pinned uv for the Hermes Core environment
        run: python -m pip install --disable-pip-version-check uv==0.13.5
      - name: Checkout official Hermes Core at the reviewed pinned commit
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_CORE_REF }}
          path: upstream-hermes
          persist-credentials: false
      - name: Build the pinned Hermes Core environment
        working-directory: upstream-hermes
        run: uv sync --frozen --python 3.14 --group dev
      - name: Register the provider and pinned official server (user-scoped defaults)
        run: python scripts/install_acp.py install --hermes-home "$RUNNER_TEMP/acp-provider-home"
      - name: Provider selection and factory probe under official Hermes
        env:
          HERMES_HOME: ${{ runner.temp }}/acp-provider-home
        run: upstream-hermes/.venv/bin/python scripts/clean_room_provider_probe.py
      - name: Confirm Hermes Core source remained unmodified
        run: |
          git -C upstream-hermes diff --exit-code
          git -C upstream-hermes diff --cached --exit-code
          test -z "$(git -C upstream-hermes status --porcelain --untracked-files=no)"
      - name: Delete the provider projection and pinned server
        run: python scripts/install_acp.py delete --hermes-home "$RUNNER_TEMP/acp-provider-home"
      - name: Record the executed-evidence boundary
        run: |
          {
            echo "### macOS arm64 native lifecycle"
            echo "- runner: macOS $(sw_vers -productVersion) / $(uname -m)"
            echo "- tested HEAD: \`$(git rev-parse HEAD)\`"
            echo "- executed: download + publisher-digest pin, install, status, verify, unauthenticated initialize, uninstall, confirmed absence, Hermes provider registration/enabled, provider selection + client factory under pinned official Hermes Core"
            echo "- NOT executed: authentication, model inference, dedicated-UID clean-room isolation"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Attest tested SHA and verified stages
        id: attest
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$CANDIDATE_SHA" ]; then
            echo "checkout HEAD $head != candidate $CANDIDATE_SHA" >&2
            exit 1
          fi
          {
            echo "sha=$head"
            echo "stages=binary_publisher_pin_sha256,install_status_verify_uninstall,provider_registration_enabled,provider_selection_factory,acp_initialize_unauthenticated"
          } >> "$GITHUB_OUTPUT"

